[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kaguya"
version = "2.13.0"
description = "Kaguya — open-source host security monitor (made by Frost)"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Ordixian (Frost)" }]
keywords = ["security", "monitoring", "threat-detection", "ids", "host"]

# The core runs on the Python standard library alone. The extras below are
# optional but recommended — install them with:  pip install -e ".[recommended]"
dependencies = []

[project.optional-dependencies]
recommended = [
    "psutil>=5.9",   # process + socket introspection (owning PID, exe, user)
    "PyYAML>=6.0",   # read config/config.yaml (built-in defaults used if absent)
]

[project.scripts]
# `kaguya` on your PATH -> cybersentinel.cli:main
kaguya = "cybersentinel.cli:main"

[tool.setuptools.packages.find]
include = ["cybersentinel*"]

[tool.setuptools.package-data]
# ship the dashboard assets that live inside the package
"cybersentinel" = ["web/*.html", "web/*.js", "web/*.css", "web/*.svg", "web/*.png", "web/*.jpg", "web/*.webp", "web/*.mp4", "web/*.webm"]
